<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>goo · jelly encased</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a10; overflow: hidden; }
  #gl { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script src="card.js"></script>
<script src="gl.js"></script>
<script>
// ── Variation 2 · "Jelly Encased" ──
// The card is set inside a thick wobbling block of clear jelly: a rounded
// slab a little larger than the card, its surface a moving lump-field that
// refracts the card beneath, with a rounded glassy bevel at the rim,
// sliding specular hotspots, a Fresnel edge glow and a faint warm
// subsurface where the jelly is thickest.
const FRAG = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 frag;
uniform vec2 uRes; uniform float uTime; uniform sampler2D uTex;
uniform vec4 uCard; uniform float uCardR;

float hash(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y); }
float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<3;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }

vec4 card(vec2 st){ return texture(uTex, vec2(st.x, 1.0-st.y)); }
float sdRound(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return min(max(q.x,q.y),0.0)+length(max(q,0.0))-r; }

float aspect(){ return uRes.x/uRes.y; }

// jelly surface height — broad, smooth swells so the card stays readable
float H(vec2 p){
  float h = fbm(p*3.0 + vec2(0.0, uTime*0.28));
  h += 0.35*fbm(p*6.0 - vec2(uTime*0.18, 0.0));
  for(int i=0;i<3;i++){ float fi=float(i);
    vec2 lp = vec2(sin(uTime*0.40+fi*2.1), cos(uTime*0.33+fi*1.7))*0.16;
    h += 0.40*exp(-dot(p-lp,p-lp)*26.0);
  }
  return h;
}

vec3 background(vec2 st){
  vec2 q = (st-0.5)*vec2(aspect(),1.0);
  vec3 a = vec3(0.05,0.055,0.085), b = vec3(0.11,0.115,0.16);
  vec3 c = mix(b, a, clamp(length(q)*1.15,0.0,1.0));
  // faint drifting goo blobs behind the slab
  for(int i=0;i<3;i++){ float fi=float(i);
    vec2 bp = vec2(sin(uTime*0.18+fi*2.0), cos(uTime*0.13+fi*1.3))*0.32;
    float g = exp(-dot(q-bp,q-bp)*7.0);
    c += g*vec3(0.10,0.09,0.06)*0.6;
  }
  return c;
}

void main(){
  vec2 st = vec2(vUv.x, 1.0-vUv.y);
  vec3 bg = background(st);

  vec2 cCenter = uCard.xy + uCard.zw*0.5;
  vec2 cHalf   = uCard.zw*0.5;
  vec2 jHalf   = cHalf + vec2(0.045,0.04);
  float jR     = uCardR + 0.045;

  // gentle whole-slab wobble + breathing
  vec2 wob = vec2(sin(uTime*0.70), cos(uTime*0.55))*0.006;
  float br = 1.0 + 0.015*sin(uTime*0.9);
  vec2 p = (st - cCenter - wob)/br;

  // wobbling gooey boundary
  float edgeN = fbm(p*9.0 + uTime*0.25);
  float d = sdRound(p, jHalf, jR) - (edgeN-0.5)*0.022;
  float inside = smoothstep(0.004,-0.004,d);

  // interior bump normal (flatter z → gentle, glossy swells)
  vec2 e = vec2(0.0020,0.0);
  float hL=H(p-e.xy), hR=H(p+e.xy), hD=H(p-e.yx), hU=H(p+e.yx);
  vec3 nBump = normalize(vec3((hL-hR)*0.6, (hD-hU)*0.6, 0.14));

  // rounded bevel toward the rim
  vec2 de = vec2(0.0016,0.0);
  float dL=sdRound(p-de.xy,jHalf,jR), dR=sdRound(p+de.xy,jHalf,jR);
  float dD=sdRound(p-de.yx,jHalf,jR), dU=sdRound(p+de.yx,jHalf,jR);
  vec2 gd = normalize(vec2(dR-dL, dU-dD)+1e-6);
  float t = clamp(-d/0.07, 0.0, 1.0);          // 0 at rim, 1 deep inside
  vec3 nBevel = normalize(vec3(gd*(1.0-t), 0.45+0.55*t));
  vec3 N = normalize(mix(nBevel, nBump, 0.20+0.75*t));

  // refraction: bend the card sample by the surface normal (gentle, so the
  // card reads clearly; a touch more bend in the rounded rim band)
  vec2 stR = st + N.xy*(0.016 + 0.018*(1.0-t));
  vec4 cc = card(stR);

  // jelly look
  vec3 jellyTint = vec3(0.96,0.88,0.62);
  vec3 L = normalize(vec3(0.42*sin(uTime*0.3)+0.2, -0.55, 0.74));
  vec3 Vd = vec3(0.0,0.0,1.0);
  vec3 Hh = normalize(L+Vd);
  float spec = pow(max(dot(N,Hh),0.0), 42.0);
  float spec2 = pow(max(dot(N,normalize(vec3(-0.4,0.5,0.7))),0.0), 18.0);
  float fres = pow(1.0-max(N.z,0.0), 3.0);

  vec3 under = mix(mix(bg, jellyTint, 0.16), cc.rgb, cc.a);
  vec3 lit = under;
  lit += spec*vec3(1.0)*1.15;
  lit += spec2*jellyTint*0.35;
  lit += fres*jellyTint*0.55;
  lit += smoothstep(0.7,1.5,H(p))*jellyTint*0.12;

  // soft contact shadow on bg just outside the slab
  float sh = smoothstep(0.075,0.0,d)*(1.0-inside);
  vec3 outCol = mix(bg - sh*0.045, lit, inside);

  frag = vec4(clamp(outCol,0.0,1.0), 1.0);
}`;
GooGL.start(FRAG, { dt: 0.04, w: 760, h: 950, seed: 7 });
</script>
</body>
</html>
