<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>goo · jelly-encased 3D (pastel)</title>
<style>
  html, body { margin: 0; height: 100%; background: #eef2f8; overflow: hidden; }
  #gl { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script src="card.js"></script>
<script src="gl.js"></script>
<script>
// ── Combo 9 · "Thick jelly block" (v2 × v4, pastel) ──
// Like combo 7 but chunkier: the card is suspended in a thick block of clear
// jelly (deeper slab, fatter rounded bevel) with big slow goo swells rolling
// under its front face rather than little beads — the most "set in a blob of
// goo" of the three, still far gentler than the original v4. Pastel-aurora bg
// with a soft contact shadow.
const FRAG = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 frag;
uniform vec2 uRes; uniform float uTime; uniform sampler2D uTex;
uniform vec4 uCard; uniform float uCardR;

vec4 cardTex(vec2 st){ return texture(uTex, vec2(st.x, 1.0-st.y)); }
float smin(float a, float b, float k){ float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }
float sdRoundBox(vec3 p, vec3 b, float r){ vec3 q=abs(p)-b+r; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0)-r; }
float sdRound2(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return min(max(q.x,q.y),0.0)+length(max(q,0.0))-r; }

vec3 pastelBg(vec2 st, float t){
  vec2 q=(st-0.5)*vec2(uRes.x/uRes.y,1.0);
  vec3 col = mix(vec3(0.985,0.982,0.997), vec3(0.927,0.945,0.972), clamp(length(q)*0.95,0.0,1.0));
  vec3 cLav=vec3(0.66,0.56,0.98), cBlu=vec3(0.46,0.77,0.94), cPnk=vec3(0.97,0.66,0.81), cGld=vec3(0.99,0.87,0.59);
  vec2 p1=vec2(-0.45+sin(t*0.10)*0.18, -0.35+cos(t*0.08)*0.14);
  vec2 p2=vec2( 0.50+sin(t*0.07+2.0)*0.16,-0.10+cos(t*0.09+1.0)*0.14);
  vec2 p3=vec2(-0.30+sin(t*0.06+4.0)*0.16, 0.45+cos(t*0.05+3.0)*0.14);
  vec2 p4=vec2( 0.35+sin(t*0.08+1.5)*0.16, 0.40+cos(t*0.07+5.0)*0.14);
  col=mix(col,cLav,exp(-dot(q-p1,q-p1)*2.4)*0.30);
  col=mix(col,cBlu,exp(-dot(q-p2,q-p2)*2.6)*0.26);
  col=mix(col,cPnk,exp(-dot(q-p3,q-p3)*2.6)*0.24);
  col=mix(col,cGld,exp(-dot(q-p4,q-p4)*3.0)*0.20);
  return col;
}

const vec3 SLAB = vec3(0.55, 0.78, 0.11);
vec3 beadPos(int i){ float fi=float(i); float ph=uTime*0.26+fi*2.0;
  return vec3(sin(ph*0.8+fi)*0.34, cos(ph*0.55+fi*1.7)*0.52, SLAB.z-0.02); }
float beadRad(int i){ float fi=float(i); return 0.18+0.04*sin(uTime*0.5+fi*2.0); }

float map(vec3 p){
  float d = sdRoundBox(p, SLAB, 0.14);            // fat rounded jelly block
  for(int i=0;i<3;i++){ float s=length(p-beadPos(i))-beadRad(i); d=smin(d,s,0.16); }
  return d;
}
vec3 calcNormal(vec3 p){ vec2 e=vec2(0.0016,0.0);
  return normalize(vec3(map(p+e.xyy)-map(p-e.xyy), map(p+e.yxy)-map(p-e.yxy), map(p+e.yyx)-map(p-e.yyx))); }
float ao(vec3 p, vec3 n){ float a=clamp(map(p+n*0.05)/0.05,0.0,1.0); return 0.55+0.45*a; }

void main(){
  float aspect=uRes.x/uRes.y;
  vec2 uv=(vUv*2.0-1.0); uv.x*=aspect;
  vec3 bg = pastelBg(vec2(vUv.x,1.0-vUv.y), uTime);

  // soft contact shadow grounding the card (screen space, offset down)
  float sd = sdRound2((vUv-vec2(0.5,0.455))*vec2(aspect,1.0), vec2(0.30,0.40), 0.10);
  bg *= 1.0 - smoothstep(0.14,0.0, sd)*0.16;

  // gentle orbit
  float a=0.22*sin(uTime*0.18), el=0.10*sin(uTime*0.15);
  vec3 ro=vec3(sin(a)*2.7, el*1.3+0.04, cos(a)*2.7);
  vec3 ww=normalize(-ro), uu=normalize(cross(vec3(0,1,0),ww)), vv=cross(ww,uu);
  vec3 rd=normalize(uv.x*uu+uv.y*vv+1.85*ww);

  float t=0.0; bool hit=false; float d;
  for(int i=0;i<80;i++){ vec3 p=ro+rd*t; d=map(p); if(d<0.0008){hit=true;break;} if(t>6.0)break; t+=d*0.85; }

  vec3 col=bg;
  if(hit){
    vec3 p=ro+rd*t; vec3 n=calcNormal(p); vec3 V=-rd;
    float lx=-p.x/SLAB.x*0.5+0.5, ly=p.y/SLAB.y*0.5+0.5;
    vec2 st=uCard.xy+vec2(clamp(lx,0.0,1.0),1.0-clamp(ly,0.0,1.0))*uCard.zw;
    float raised=clamp((p.z-SLAB.z)*3.0+0.3,0.0,1.0);
    st += n.xy*raised*0.038;                        // a touch more bend, still gentle
    vec4 cc=cardTex(st);
    vec3 gooTint=vec3(0.90,0.78,0.42);
    vec3 base=mix(cc.rgb, gooTint, raised*0.14);
    // where the face has no card (margin) use a pale gold gel
    base=mix(vec3(0.93,0.90,0.82), base, cc.a);

    vec3 L1=normalize(vec3(0.45,0.8,0.65)), L2=normalize(vec3(-0.6,0.25,0.5));
    float dif=max(dot(n,L1),0.0)*0.45+max(dot(n,L2),0.0)*0.2+0.62;
    dif*=ao(p,n);
    float spec=pow(max(dot(n,normalize(L1+V)),0.0),70.0)*0.9
             + pow(max(dot(n,normalize(L2+V)),0.0),36.0)*0.3;
    float fres=pow(1.0-max(dot(n,V),0.0),3.5);

    vec3 lit=base*dif;
    lit+=spec*vec3(1.0);
    lit+=fres*mix(vec3(0.72,0.66,0.95), vec3(1.0), 0.4)*0.45;  // lavender-white rim
    col=lit;
  }
  frag=vec4(clamp(col,0.0,1.0),1.0);
}`;
GooGL.start(FRAG, { dt: 0.05, w: 760, h: 950, seed: 7 });
</script>
</body>
</html>
