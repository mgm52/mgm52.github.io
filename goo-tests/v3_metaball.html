<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>goo · metaball merge</title>
<style>
  html, body { margin: 0; height: 100%; background: #08090e; overflow: hidden; }
  #gl { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script src="card.js"></script>
<script src="gl.js"></script>
<script>
// ── Variation 3 · "Metaball merge" ──
// The card is one mass in a metaball field; fat globs of goo orbit it and,
// as they swing close, fuse into the card's edge with stretching gooey
// necks (the classic threshold-field merge), then peel away again. The
// whole field is shaded from its own gradient so the goo reads as rounded,
// wet and 3D — colored translucent tier-gold over the card stock.
const FRAG = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 frag;
uniform vec2 uRes; uniform float uTime; uniform sampler2D uTex;
uniform vec4 uCard; uniform float uCardR;

vec4 cardTex(vec2 st){ return texture(uTex, vec2(st.x, 1.0-st.y)); }
float sdRound(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return min(max(q.x,q.y),0.0)+length(max(q,0.0))-r; }

float SY(){ return uRes.y/uRes.x; }           // round-blob metric helper

vec2 cCenter, cHalf; float cR;

float blobC(int i){ return 1.30; }
vec2 blobPos(int i){
  float fi=float(i);
  float ang = uTime*0.42 + fi*1.05;
  float orb = 0.30 + 0.16*sin(uTime*0.5 + fi*1.7);
  // some blobs swing far out then dive back in (merge) and peel off again
  float pull = 0.7 + 0.55*sin(uTime*0.30 + fi*2.1);
  return cCenter + vec2(cos(ang), sin(ang*1.07))*orb*pull*vec2(1.0, 1.0/SY());
}

// metaball field: card plateau + gaussian globs
float F(vec2 p){
  float dc = sdRound(p-cCenter, cHalf, cR);
  float f = 1.34*smoothstep(0.05,-0.03,dc);
  for(int i=0;i<6;i++){
    vec2 b = blobPos(i);
    vec2 dd = p-b; float r2 = dd.x*dd.x + (dd.y*SY())*(dd.y*SY());
    f += blobC(i)*exp(-r2*52.0);
  }
  return f;
}

vec3 background(vec2 st){
  vec2 q=(st-0.5)*vec2(uRes.x/uRes.y,1.0);
  vec3 a=vec3(0.04,0.05,0.075), b=vec3(0.10,0.11,0.155);
  vec3 c=mix(b,a,clamp(length(q)*1.1,0.0,1.0));
  return c;
}

void main(){
  vec2 st = vec2(vUv.x, 1.0-vUv.y);
  cCenter = uCard.xy + uCard.zw*0.5;
  cHalf   = uCard.zw*0.5;
  cR      = uCardR;

  vec3 bg = background(st);
  float T = 1.0;
  float f = F(st);
  float inside = smoothstep(T-0.06, T+0.06, f);

  // field gradient → surface normal (height = field)
  vec2 e = vec2(0.0016,0.0);
  float fx = F(st+e.xy)-F(st-e.xy);
  float fy = F(st+e.yx)-F(st-e.yx);
  vec3 n = normalize(vec3(-fx, -fy, 0.06));

  // where are we relative to the card stock?
  float dc = sdRound(st-cCenter, cHalf, cR);
  float onCard = smoothstep(0.012,-0.012, dc);

  // refract the card a touch under the goo bulge
  vec2 stR = st + n.xy*0.03;
  vec4 cc = cardTex(stR);

  vec3 gooCol = vec3(0.86,0.72,0.30);          // translucent tier-gold goo
  // base color: card on the stock, goo color out on the necks/globs
  vec3 base = mix(gooCol, cc.rgb, onCard*cc.a);

  // lighting
  vec3 L = normalize(vec3(0.45*sin(uTime*0.25)+0.15, 0.5, 0.8));
  vec3 V = vec3(0.0,0.0,1.0);
  vec3 H = normalize(L+V);
  float dif = max(dot(n,L),0.0)*0.7 + 0.55;
  float spec = pow(max(dot(n,H),0.0), 48.0);
  float fres = pow(1.0-max(n.z,0.0), 3.0);

  vec3 lit = base*dif;
  lit += spec*vec3(1.0)*1.2;
  lit += fres*mix(gooCol, vec3(1.0,0.95,0.7), 0.4)*0.7;
  // a little internal warmth in thick goo away from the card
  lit += (1.0-onCard)*smoothstep(1.1,1.8,f)*gooCol*0.25;

  // contact shadow on bg just outside the silhouette
  float halo = smoothstep(T+0.05, T-0.25, f)*(1.0-inside);
  vec3 outCol = mix(bg - halo*0.05, lit, inside);

  frag = vec4(clamp(outCol,0.0,1.0),1.0);
}`;
GooGL.start(FRAG, { dt: 0.045, w: 760, h: 950, seed: 7 });
</script>
</body>
</html>
